[window]
decorations = "None"

[font]
size = 10.0

[font.normal]
family = "MesloLGS Nerd Font Mono"
style = "Regular"

[font.bold]
family = "MesloLGS Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style = "Italic"

[colors]
draw_bold_text_with_bright_colors=true

[mouse]
hide_when_typing = true
